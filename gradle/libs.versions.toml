[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose = "1.12.1"
material3 = "1.5.0-alpha25"
activityCompose = "1.13.0"
lifecycle = "2.9.2"
haze = "2.0.1"
tvprovider = "1.1.0"
room = "2.7.2"
datastore = "1.1.7"
coroutines = "1.10.2"
coil = "3.6.3"
okhttp = "4.12.0"
materialkolor = "6.0.0"
ksp = "2.3.13"
work = "2.10.5"
media3 = "1.9.0"
nanohttpd = "2.3.1"
zxing = "3.5.3"
icu4j = "77.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "compose" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
materialkolor = { module = "com.materialkolor:material-color-utilities", version.ref = "materialkolor" }
